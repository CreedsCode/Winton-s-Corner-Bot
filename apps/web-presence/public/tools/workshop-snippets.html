<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overwatch Workshop Snippets</title>
    <link rel="stylesheet" href="assets/workshop-snippets_style.css" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <!-- Overwatch-esque hexagon icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L21.5 7 L21.5 17 L12 22 L2.5 17 L2.5 7 Z" />
        </svg>
        <h1>Overwatch <span>Workshop</span> Snippets</h1>
      </div>
      <span class="header-meta" id="snippet-count"></span>
    </header>

    <div class="toolbar">
      <div class="search-wrap">
        <!-- Search icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="search"
          id="search"
          placeholder="Search snippets…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </div>

    <main>
      <div id="snippet-grid">
        <!-- Cards injected by app.js -->
      </div>

      <div id="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>No snippets match your search.</p>
      </div>
    </main>

    <script src="assets/workshop-snippets_snippets.js"></script>
    <script src="assets/workshop-snippets_app.js"></script>
  </body>
</html>
