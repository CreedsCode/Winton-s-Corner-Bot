version: "3.9"

services:
  nginx:
    build:
      context: ./apps/web-presence
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - postgrest
      - auth-shim

  auth-shim:
    build:
      context: ./apps/auth-shim
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${API_DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}

  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${API_DB_NAME}
      - AUTHENTICATOR_PASSWORD=${AUTHENTICATOR_PASSWORD}
      - BOT_DB_NAME=${BOT_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${API_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PGRST_DB_URI=${PGRST_DB_URI}
      - PGRST_DB_SCHEMA=${PGRST_DB_SCHEMA}
      - PGRST_DB_ANON_ROLE=${PGRST_DB_ANON_ROLE}
      - PGRST_JWT_SECRET=${JWT_SECRET}
      - PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS}
      - PGRST_SERVER_PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

  # TODO discord-bot:

volumes:
  postgres_data:
